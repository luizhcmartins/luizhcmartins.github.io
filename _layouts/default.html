<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.url == '/' %}{{ page.title }} — {% endunless %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <main class="pagina">
    {{ content }}
  </main>
  {% unless page.url == '/' %}
  <footer class="rodape">
    <a href="{{ '/' | relative_url }}">Início</a>
    <a href="{{ '/projetos/' | relative_url }}">Projetos</a>
    <a href="{{ '/escritos/' | relative_url }}">Escritos</a>
    <a href="{{ '/contato/' | relative_url }}">Contato</a>
  </footer>
  {% endunless %}
</body>
</html>
