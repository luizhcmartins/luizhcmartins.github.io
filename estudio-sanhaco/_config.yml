title: Estúdio Sanhaço
lang: pt-BR
# Se o repositório NÃO for "usuario.github.io", use baseurl: "/nome-do-repositorio"
baseurl: ""
markdown: kramdown

# Cada arquivo em _projetos/ e _escritos/ vira uma página automaticamente.
collections:
  projetos:
    output: true
    permalink: /projetos/:name/
  escritos:
    output: true
    permalink: /escritos/:name/

defaults:
  - scope: { path: "", type: projetos }
    values: { layout: projeto }
  - scope: { path: "", type: escritos }
    values: { layout: escrito }
